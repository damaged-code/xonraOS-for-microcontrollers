<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1800" width="1000" height="1800" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>How to install xonraOS</title>
  <defs>
    <style>
      .h{font-size:20px;font-weight:700;fill:#fff}
      .t{font-size:15px;fill:#d6d6d6}
      .m{font-size:13px;fill:#9a9a9a}
      .code{font-family:Consolas,'Courier New',monospace;font-size:13px;fill:#7fdbff}
      .num{font-size:18px;font-weight:700;fill:#000}
      .card{fill:#121212;stroke:#2a2a2a}
      .pic{fill:#1c1c1c}
      .ln{stroke:#d6d6d6;stroke-width:2;fill:none}
      .ac{fill:#4da3ff}
      .acs{stroke:#4da3ff;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1000" height="1800" fill="#000"/>

  <text x="40" y="56" font-size="32" font-weight="700" fill="#fff">How to install</text>
  <text x="40" y="86" class="t">Put xonraOS on your ESP8266 board with the free Arduino IDE. It takes about 15 minutes, and you only do it once.</text>
  <text x="40" y="108" class="m">Later updates install over Wi-Fi from Settings › Firmware.</text>

  <!-- ===== Step 1: wire it ===== -->
  <g transform="translate(40,140)">
    <rect class="card" width="920" height="190" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="158" rx="8"/>
    <!-- breadboard -->
    <rect x="40" y="40" width="232" height="110" rx="6" fill="#e8e8e8"/>
    <line x1="40" y1="95" x2="272" y2="95" stroke="#bbb" stroke-width="4"/>
    <g fill="#bbb"><circle cx="60" cy="55" r="2"/><circle cx="72" cy="55" r="2"/><circle cx="84" cy="55" r="2"/><circle cx="60" cy="135" r="2"/><circle cx="72" cy="135" r="2"/><circle cx="84" cy="135" r="2"/></g>
    <rect x="150" y="68" width="100" height="54" rx="3" fill="#1d3557"/>
    <rect x="232" y="85" width="22" height="20" fill="#aaa"/>
    <rect x="58" y="62" width="58" height="40" rx="2" fill="#111"/>
    <rect x="63" y="67" width="48" height="24" fill="#0b3d5c"/>
    <circle cx="96" cy="128" r="7" fill="#333"/><circle cx="96" cy="128" r="4" fill="#666"/>
    <path d="M116 80 Q135 60 158 78" stroke="#e63946" stroke-width="3" fill="none"/>
    <path d="M100 121 Q130 140 165 116" stroke="#2a9d8f" stroke-width="3" fill="none"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">1</text>
    <text x="370" y="46" class="h">Wire it up</text>
    <text x="336" y="82" class="t">Place the board, screen and button on the breadboard as shown in</text>
    <text x="336" y="104" class="t"><tspan fill="#4da3ff">How to place</tspan>. Use 3V3 for the screen, never 5V.</text>
    <text x="336" y="140" class="m">Only the board, the screen and one button (D7) are needed to start.</text>
  </g>

  <!-- ===== Step 2: Arduino IDE ===== -->
  <g transform="translate(40,350)">
    <rect class="card" width="920" height="190" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="158" rx="8"/>
    <!-- laptop -->
    <rect x="70" y="36" width="172" height="104" rx="6" fill="#2b2b2b" stroke="#555"/>
    <rect x="78" y="44" width="156" height="88" fill="#00979d"/>
    <g fill="none" stroke="#fff" stroke-width="5">
      <circle cx="140" cy="88" r="15"/><circle cx="172" cy="88" r="15"/>
    </g>
    <g stroke="#fff" stroke-width="3"><line x1="133" y1="88" x2="147" y2="88"/><line x1="165" y1="88" x2="179" y2="88"/><line x1="172" y1="81" x2="172" y2="95"/></g>
    <path d="M50 140 H262 L250 152 H62 Z" fill="#444"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">2</text>
    <text x="370" y="46" class="h">Install the Arduino IDE</text>
    <text x="336" y="82" class="t">Download it free from <tspan fill="#4da3ff">arduino.cc/en/software</tspan> and install it</text>
    <text x="336" y="104" class="t">like any other program (Windows, Mac or Linux).</text>
    <text x="336" y="140" class="m">On Windows, also install the CP210x USB driver if your board is not found later.</text>
  </g>

  <!-- ===== Step 3: ESP8266 boards ===== -->
  <g transform="translate(40,560)">
    <rect class="card" width="920" height="210" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="178" rx="8"/>
    <!-- boards manager window -->
    <rect x="40" y="36" width="232" height="140" rx="6" fill="#f2f2f2"/>
    <rect x="40" y="36" width="232" height="22" rx="6" fill="#00979d"/>
    <text x="50" y="52" font-size="11" fill="#fff" font-weight="700">BOARDS MANAGER</text>
    <rect x="52" y="66" width="208" height="20" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="60" y="80" font-size="11" fill="#333">esp8266</text>
    <rect x="52" y="96" width="208" height="66" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="60" y="114" font-size="11" font-weight="700" fill="#222">esp8266</text>
    <text x="60" y="130" font-size="10" fill="#777">by ESP8266 Community</text>
    <rect x="182" y="136" width="66" height="20" rx="4" fill="#00979d"/>
    <text x="193" y="150" font-size="11" fill="#fff" font-weight="700">INSTALL</text>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">3</text>
    <text x="370" y="46" class="h">Add ESP8266 support</text>
    <text x="336" y="82" class="t">File › Preferences › "Additional boards manager URLs", paste:</text>
    <rect x="336" y="94" width="560" height="28" rx="6" fill="#1c1c1c"/>
    <text x="348" y="113" class="code">http://arduino.esp8266.com/stable/package_esp8266com_index.json</text>
    <text x="336" y="148" class="t">Then Tools › Board › Boards Manager, search <tspan fill="#fff" font-weight="700">esp8266</tspan> and click Install.</text>
    <text x="336" y="176" class="m">Version 3.1.2 is the one xonraOS is tested with.</text>
  </g>

  <!-- ===== Step 4: libraries ===== -->
  <g transform="translate(40,790)">
    <rect class="card" width="920" height="190" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="158" rx="8"/>
    <!-- books -->
    <rect x="80" y="50" width="34" height="100" rx="3" fill="#4da3ff"/>
    <rect x="118" y="40" width="30" height="110" rx="3" fill="#e9c46a"/>
    <rect x="152" y="56" width="36" height="94" rx="3" fill="#2a9d8f"/>
    <g transform="rotate(12 220 100)"><rect x="196" y="48" width="32" height="102" rx="3" fill="#e76f51"/></g>
    <g stroke="#000" stroke-opacity=".35" stroke-width="3"><line x1="86" y1="70" x2="108" y2="70"/><line x1="124" y1="62" x2="142" y2="62"/><line x1="158" y1="76" x2="182" y2="76"/></g>
    <line x1="64" y1="152" x2="250" y2="152" stroke="#777" stroke-width="4"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">4</text>
    <text x="370" y="46" class="h">Install the libraries</text>
    <text x="336" y="82" class="t">Tools › Manage Libraries, then search and install each one:</text>
    <text x="352" y="110" class="t">•  <tspan fill="#fff" font-weight="700">Adafruit SSD1306</tspan>  (click "Install all" when it asks)</text>
    <text x="352" y="134" class="t">•  <tspan fill="#fff" font-weight="700">Adafruit GFX Library</tspan></text>
    <text x="352" y="158" class="t">•  <tspan fill="#fff" font-weight="700">elk</tspan>  (version 2.2.0, runs the apps)</text>
  </g>

  <!-- ===== Step 5: download ===== -->
  <g transform="translate(40,1000)">
    <rect class="card" width="920" height="190" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="158" rx="8"/>
    <!-- folder with download arrow -->
    <path d="M70 70 H130 L144 84 H242 V152 H70 Z" fill="#e9c46a"/>
    <path d="M70 92 H242 V152 H70 Z" fill="#f4d58d"/>
    <line x1="156" y1="34" x2="156" y2="118" stroke="#4da3ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M134 98 L156 122 L178 98" stroke="#4da3ff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">5</text>
    <text x="370" y="46" class="h">Download xonraOS</text>
    <text x="336" y="82" class="t">On <tspan fill="#4da3ff">github.com/damaged-code/xonraOS-for-microcontrollers</tspan> click</text>
    <text x="336" y="104" class="t">the green <tspan fill="#fff" font-weight="700">Code</tspan> button › <tspan fill="#fff" font-weight="700">Download ZIP</tspan>, and unzip it.</text>
    <text x="336" y="140" class="t">Open <tspan class="code">firmware/xonraOS/xonraOS.ino</tspan> in the Arduino IDE.</text>
  </g>

  <!-- ===== Step 6: wifi ===== -->
  <g transform="translate(40,1210)">
    <rect class="card" width="920" height="200" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="168" rx="8"/>
    <!-- wifi symbol + key -->
    <g fill="none" stroke="#4da3ff" stroke-width="9" stroke-linecap="round">
      <path d="M96 92 A86 86 0 0 1 216 92"/>
      <path d="M116 114 A56 56 0 0 1 196 114"/>
      <path d="M136 136 A28 28 0 0 1 176 136"/>
    </g>
    <circle cx="156" cy="156" r="8" fill="#4da3ff"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">6</text>
    <text x="370" y="46" class="h">Add your Wi-Fi</text>
    <text x="336" y="82" class="t">In the same folder, copy <tspan class="code">secrets.example.h</tspan> and rename the copy</text>
    <text x="336" y="104" class="t">to <tspan class="code">secrets.h</tspan>. Open it and type your Wi-Fi name and password:</text>
    <rect x="336" y="116" width="420" height="50" rx="6" fill="#1c1c1c"/>
    <text x="348" y="136" class="code">#define WIFI_NAME     "your-wifi"</text>
    <text x="348" y="156" class="code">#define WIFI_PASSWORD "your-password"</text>
    <text x="336" y="186" class="m">2.4 GHz Wi-Fi only (the ESP8266 can't see 5 GHz). Keep the quotes.</text>
  </g>

  <!-- ===== Step 7: upload ===== -->
  <g transform="translate(40,1430)">
    <rect class="card" width="920" height="200" rx="12"/>
    <rect class="pic" x="16" y="16" width="280" height="168" rx="8"/>
    <!-- laptop -> cable -> board -->
    <rect x="34" y="62" width="96" height="62" rx="4" fill="#2b2b2b" stroke="#555"/>
    <rect x="40" y="68" width="84" height="50" fill="#00979d"/>
    <circle cx="82" cy="93" r="13" fill="#fff"/>
    <path d="M77 86 L89 93 L77 100 Z" fill="#00979d"/>
    <path d="M24 124 H140 L134 132 H30 Z" fill="#444"/>
    <path d="M140 112 C175 112 170 150 200 150" stroke="#ddd" stroke-width="4" fill="none"/>
    <rect x="198" y="120" width="76" height="46" rx="3" fill="#1d3557"/>
    <rect x="198" y="140" width="10" height="10" fill="#aaa"/>
    <rect x="228" y="128" width="34" height="22" rx="2" fill="#555"/>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">7</text>
    <text x="370" y="46" class="h">Plug in and upload</text>
    <text x="336" y="82" class="t">Connect the board with a USB <tspan fill="#fff" font-weight="700">data</tspan> cable. In Tools choose:</text>
    <text x="352" y="108" class="t">Board: <tspan fill="#fff" font-weight="700">NodeMCU 1.0 (ESP-12E Module)</tspan></text>
    <text x="352" y="132" class="t">Port: the COM port that appeared (for example COM5)</text>
    <text x="336" y="160" class="t">Click the <tspan fill="#4da3ff" font-weight="700">Upload ➜</tspan> button and wait for "Done uploading".</text>
    <text x="336" y="186" class="m">An upload error? Just click Upload again. Not found? Try another cable.</text>
  </g>

  <!-- ===== Step 8: done ===== -->
  <g transform="translate(40,1650)">
    <rect class="card" width="920" height="130" rx="12" stroke="#4da3ff"/>
    <rect class="pic" x="16" y="16" width="280" height="98" rx="8"/>
    <rect x="96" y="26" width="120" height="78" rx="4" fill="#111" stroke="#555"/>
    <rect x="104" y="34" width="104" height="54" fill="#000"/>
    <text x="156" y="68" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" font-family="Consolas,monospace">12:30</text>
    <text x="156" y="84" font-size="8" fill="#bbb" text-anchor="middle">Sat 22 Nov</text>
    <circle cx="336" cy="40" r="18" class="ac"/><text x="330" y="46" class="num">8</text>
    <text x="370" y="46" class="h">Done!</text>
    <text x="336" y="80" class="t">The xonraOS logo appears, then the clock sets itself over Wi-Fi.</text>
    <text x="336" y="104" class="t">Tap to move, hold to open. Get more apps from the <tspan fill="#4da3ff">Store</tspan>.</text>
  </g>
</svg>
